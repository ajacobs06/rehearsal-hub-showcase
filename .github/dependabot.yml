# Weekly dependency updates, grouped so there's one PR per ecosystem. Each PR runs the normal
# build and tests; nothing deploys until it's merged to main.
version: 2
updates:
  - package-ecosystem: pip
    directory: /api # requirements.in -> requirements.txt (pip-compile, with hashes)
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
