name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Repo variable, set with the other AZURE_* ones (the web app's name, the appName Bicep param).
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build front end
        working-directory: app
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Test API
        working-directory: api
        run: |
          pip install -r requirements-dev.txt
          pytest -q

      # The free plan has a daily CPU quota, and building on App Service (Oryx pip install) can use
      # it all up. So dependencies are installed here and App Service only runs the package.
      - name: Package API dependencies
        run: pip install --target api/pydeps -r api/requirements.txt

      # Boot the exact package with nothing else installed, so a package that can't start fails
      # here and never reaches App Service.
      - name: Smoke test the package
        working-directory: api
        run: |
          python -m venv /tmp/bare
          PYTHONPATH=pydeps /tmp/bare/bin/python -m gunicorn -w 1 -k worker.Worker main:app --bind 127.0.0.1:8000 &
          pid=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then kill $pid; exit 0; fi
            sleep 1
          done
          echo "The package did not start"; exit 1

      - name: Bundle front end into API
        run: cp -R app/dist api/static

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: |
            api
            !api/__pycache__
            !api/.pytest_cache
            !api/.venv

  deploy:
    # Only the private source repo deploys; public copies just build and test.
    if: github.repository == 'ajacobs06/rehearsal-hub' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net
    # OIDC: GitHub issues a short-lived token that Azure trusts for the deploy identity
    # (infra/main.bicep, id-rehearsal-hub-deploy). No stored credentials.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: site
